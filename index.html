<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Planner – Rechtliches / Legal</title>
<style>
:root{--bg:#F6F0E4;--card:#FFFFFF;--text:#1F2A2A;--muted:#5E6B6A;--line:#E3DACB;--accent:#2F8478;--accent-soft:#E3F1EE}
@media (prefers-color-scheme:dark){:root{--bg:#111515;--card:#1B2121;--text:#ECEFEE;--muted:#A3AEAD;--line:#2C3434;--accent:#5FC2B3;--accent-soft:#1F3330}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{max-width:760px;margin:0 auto;padding:28px 16px 0;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:19px;color:var(--text);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:15px}
nav a[aria-current]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a.lang{border:1px solid var(--line)}
main{max-width:760px;margin:20px auto 40px;padding:32px 24px;background:var(--card);border-radius:20px}
@media (max-width:600px){main{margin:16px 0 32px;border-radius:0;padding:24px 16px}}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
.intro{color:var(--muted);margin:0 0 8px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;margin:16px 0 0}
h2{font-size:20px;margin:32px 0 8px}
.field{margin:10px 0}
.label{font-size:14px;color:var(--muted)}
.value{font-weight:500}
ul{padding-left:22px}
li{margin:4px 0}
a{color:var(--accent);overflow-wrap:anywhere}
footer{max-width:760px;margin:0 auto 40px;padding:0 16px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
  <header><span class="brand">Coach Planner</span></header>
  <main>
    <h1>Rechtliches · Legal</h1>
    <h2>Deutsch</h2><ul><li><a href="de/datenschutz.html">Datenschutz</a></li><li><a href="de/impressum.html">Impressum</a></li><li><a href="de/nutzungsbedingungen.html">Nutzungsbedingungen</a></li></ul>
    <h2>English</h2><ul><li><a href="en/privacy.html">Privacy</a></li><li><a href="en/imprint.html">Imprint</a></li><li><a href="en/terms.html">Terms of Use</a></li></ul>
  </main>
</body>
</html>
